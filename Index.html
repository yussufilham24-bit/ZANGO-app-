<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00A651">
<link rel="manifest" href="manifest.json">
  <title>ZANGO Mobility</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #00A651;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      background: #00A651;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service {
      background: #eefaf3;
      padding: 18px 10px;
      text-align: center;
      border-radius: 12px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🚕 ZANGO</h1>
  <p>Your Mobility Partner in Zanzibar</p>
</header>

<div class="container">

  <div class="card">
    <h2>Our Services</h2>

    <div class="services">
      <div class="service">🚕 Taxi</div>
      <div class="service">🛺 Bajaji</div>
      <div class="service">🏍️ Bodaboda</div>
      <div class="service">📦 Delivery</div>
      <div class="service">🌴 ZANGO Tour</div>
      <div class="service">💍 Wedding</div>
    </div>
  </div>

  <div class="card">
    <h2>Book ZANGO</h2>

    <label>Your Name</label>
    <input id="name" type="text" placeholder="Enter your name">

    <label>Phone Number</label>
    <input id="phone" type="tel" placeholder="07XXXXXXXX">

    <label>Pickup Location</label>
    <input id="pickup" type="text" placeholder="Where should we pick you?">

    <label>Destination</label>
    <input id="destination" type="text" placeholder="Where are you going?">

    <label>Transport</label>
    <select id="vehicle">
      <option value="Taxi">Taxi 🚕</option>
      <option value="Bajaji">Bajaji 🛺</option>
      <option value="Bodaboda">Bodaboda 🏍️</option>
      <option value="Delivery">Delivery 📦</option>
      <option value="ZANGO Tour">ZANGO Tour 🌴</option>
      <option value="Wedding Transport">Wedding Transport 💍</option>
    </select>

    <label>Time</label>
    <input id="time" type="text" placeholder="Now / 10:00 AM">

    <label>Extra Details</label>
    <textarea id="notes" placeholder="Any additional information"></textarea>

    <button onclick="sendOrder()">BOOK ZANGO</button>
  </div>

</div>

<div class="footer">
  ZANGO Mobility • Zanzibar<br>
  📞 0772530367
</div>

<script>
function sendOrder() {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const pickup = document.getElementById("pickup").value;
  const destination = document.getElementById("destination").value;
  const vehicle = document.getElementById("vehicle").value;
  const time = document.getElementById("time").value;
  const notes = document.getElementById("notes").value;

  if (!name || !phone || !pickup || !destination) {
    alert("Please fill in your name, phone, pickup and destination.");
    return;
  }

  const message =
`🚕 ZANGO NEW ORDER

👤 Name: ${name}
📞 Phone: ${phone}
📍 Pickup: ${pickup}
🏁 Destination: ${destination}
🚘 Transport: ${vehicle}
🕐 Time: ${time || "Now"}
📝 Details: ${notes || "None"}

Thank you for choosing ZANGO.`;

  const whatsappNumber = "255772530367";

  const url =
    "https://wa.me/" + whatsappNumber +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}
</script>

</body>
</html>
